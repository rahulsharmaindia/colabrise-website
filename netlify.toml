[build]
  command = "npm run build"
  publish = "dist"

# Edge functions register their own routes via `config.path` in each file:
#   /api/og        → netlify/edge-functions/og.ts
#   /api/og-image  → netlify/edge-functions/og-image.tsx
# Netlify runs matching edge functions before the SPA redirect below.

# SPA fallback — every non-function path serves index.html so React Router
# can handle client-side routes like /campaigns/:id.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
