[build]
  command = "npm run build"
  publish = "dist"

# Edge function for dynamic OG meta tags on campaign share links
[[edge_functions]]
  function = "og-campaign"
  path = "/campaigns/*"

[[edge_functions]]
  function = "og-campaign"
  path = "/dashboard/campaigns/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
